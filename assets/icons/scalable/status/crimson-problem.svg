<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
	<defs>
		<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#2a0a10"/>
			<stop offset="1" stop-color="#0a0204"/>
		</linearGradient>
		<radialGradient id="heart" cx="0.5" cy="0.4" r="0.55">
			<stop offset="0" stop-color="#c8102e" stop-opacity="0.38"/>
			<stop offset="1" stop-color="#c8102e" stop-opacity="0"/>
		</radialGradient>
		<linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ff4d5e" stop-opacity="0.18"/>
